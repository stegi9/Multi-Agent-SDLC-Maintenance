apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: sdlc-platform
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: sdlc_platform
            - name: MYSQL_USER
              value: sdlc
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: MYSQL_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command: ["mysqladmin", "ping", "-h", "localhost"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: initdb
          configMap:
            name: mysql-initdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: sdlc-platform
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
---
# Creare il ConfigMap dello schema con:
#   kubectl -n sdlc-platform create configmap mysql-initdb \
#     --from-file=infrastructure/mysql/init/01-schema.sql
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-initdb
  namespace: sdlc-platform
data: {}
