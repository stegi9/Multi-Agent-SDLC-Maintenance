apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: sdlc-platform
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: sdlc
  MYSQL_DATABASE: sdlc_platform
  QDRANT_URL: http://qdrant:6333
  LLM_BASE_URL: http://ollama:11434
  LOG_LEVEL: info
---
# NOTA: valori di esempio per sviluppo. In produzione gestire i secret
# con strumenti dedicati (Sealed Secrets, External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: sdlc-platform
type: Opaque
stringData:
  MYSQL_PASSWORD: sdlc
  MYSQL_ROOT_PASSWORD: root
  JWT_SECRET: change-me-in-production
  JIRA_API: ""
  JIRA_BASE_URL: ""
