apiVersion: apps/v1
kind: Deployment
metadata:
  name: impact-analysis-service
  namespace: sdlc-platform
  labels:
    app: impact-analysis-service
    tier: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: impact-analysis-service
  template:
    metadata:
      labels:
        app: impact-analysis-service
        tier: ai
    spec:
      containers:
        - name: impact-analysis-service
          image: sdlc-platform/impact-analysis-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: platform-config
            - secretRef:
                name: platform-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: impact-analysis-service
  namespace: sdlc-platform
spec:
  selector:
    app: impact-analysis-service
  ports:
    - port: 80
      targetPort: 8000
