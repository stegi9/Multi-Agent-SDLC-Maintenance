# SPA Angular + reverse proxy verso i microservizi (nomi DNS della rete docker-compose)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload documentale (max 2 MB lato API + margine)
    client_max_body_size 5m;

    # DNS interno di Docker: risolve gli hostname dei servizi A OGNI RICHIESTA.
    # Senza questo, nginx risolverebbe l'IP solo all'avvio e, se un servizio
    # viene ricreato (nuovo IP), il proxy darebbe 502/404 finché non si riavvia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Routing client-side Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ogni gruppo: variabile per l'upstream (forza la risoluzione dinamica via resolver)
    # + rewrite del prefisso /api/<alias>/ -> /api/v1/ del servizio.
    location /api/auth/ {
        set $up auth-rbac-service;
        rewrite ^/api/auth/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/ingestion/ {
        set $up ingestion-sync-service;
        rewrite ^/api/ingestion/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/rag/ {
        set $up rag-db-manager;
        rewrite ^/api/rag/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/validator/ {
        set $up document-validator-service;
        rewrite ^/api/validator/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/evaluation/ {
        set $up evaluation-service;
        rewrite ^/api/evaluation/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/impact/ {
        set $up impact-analysis-service;
        rewrite ^/api/impact/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/topology/ {
        set $up topology-service;
        rewrite ^/api/topology/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/workorders/ {
        set $up wo-generator-service;
        rewrite ^/api/workorders/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/coding/ {
        set $up coding-service;
        rewrite ^/api/coding/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/documentation/ {
        set $up documentation-service;
        rewrite ^/api/documentation/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
    location /api/testing/ {
        set $up test-runner-service;
        rewrite ^/api/testing/(.*)$ /api/v1/$1 break;
        proxy_pass http://$up:8000;
    }
}
